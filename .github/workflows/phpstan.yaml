name: PHPStan
on: [ workflow_dispatch, pull_request ]

env:
  PLUGIN_CODE: ApiToken42
  PLUGIN_PACKAGE_NAME: 'ec-cube/apitoken42'

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eccube-versions: ['4.3']
        php-versions: [ '8.1' ]
        database: [ 'mysql' ]
        include:
          - database: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_server_version: 5.7
            database_charset: utf8mb4
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Clone and archive dependent plugin
        run: |
          git clone https://github.com/EC-CUBE/eccube-api4 /tmp/Api42
          mkdir -p /tmp/repos
          cd /tmp/Api42 && tar cvzf /tmp/repos/Api42.tgz ./*

      - uses: kurozumi/eccube-plugin-phpstan@main
        with:
          plugin-code: ${{ env.PLUGIN_CODE }}
          plugin-package-name: ${{ env.PLUGIN_PACKAGE_NAME }}
          dependency-plugins-enable: |
            bin/console eccube:plugin:enable --code Api42
